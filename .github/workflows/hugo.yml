name: Build and deploy Hugo site

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: '0.115.3'
  HUGO_ENVIRONMENT: production
  HUGO_ENV: production
  TZ: Europe/London

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Hugo
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          mkdir -p "${RUNNER_TEMP}/hugo"
          cd "${RUNNER_TEMP}/hugo"
          curl --fail --silent --show-error --location --retry 3 "${release}/${archive}" --output "${archive}"
          curl --fail --silent --show-error --location --retry 3 "${release}/hugo_${HUGO_VERSION}_checksums.txt" --output checksums.txt
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          tar -xzf "${archive}" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          base_url="${PAGES_BASE_URL:-https://geriskenderi.github.io}"
          base_url="${base_url%/}/"
          hugo --gc --minify --baseURL "${base_url}"
          python3 scripts/check_site.py public --base-url "${base_url}"

      - name: Check project-site paths
        run: |
          hugo --minify --baseURL "https://example.org/personal-site/" --destination "${RUNNER_TEMP}/project-site"
          python3 scripts/check_site.py "${RUNNER_TEMP}/project-site" --base-url "https://example.org/personal-site/"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
